name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: hermes-agent/pyproject.toml
      - name: Install Hermes and test dependencies
        run: python -m pip install -e ./hermes-agent pytest pytest-asyncio pytest-timeout aiohttp
      - name: Unit tests (fake Rocket.Chat, no network)
        run: python -m pytest tests/ -q --timeout=60
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/hermes-agent

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  doctor:
    # Validates the manifest and registration through Hermes' real plugin loader.
    # Best-effort: Hermes moves fast and this job must not block a plugin fix.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch hermes-agent
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
      - name: Install hermes-agent
        run: pip install -e /tmp/hermes-agent
      - name: Plugin doctor
        run: python /tmp/hermes-agent/cli.py plugins doctor . --ci || hermes plugins doctor . --ci
