# Hermes loads this directory as a plugin, not a pip-installable package. Keep Ruff configuration
# here: a pyproject.toml would make Hermes treat the plugin as a uv workspace package (issue #8).

line-length = 120
target-version = "py311"
extend-exclude = [".audit"]

[lint]
# Correctness-oriented rules only; formatting is not enforced so upstream diffs stay small.
select = ["E9", "F", "B", "UP", "SIM"]
ignore = ["B905", "UP007", "UP035", "UP006", "UP045", "SIM102", "SIM105", "SIM108", "SIM113", "SIM117"]

[lint.per-file-ignores]
"tests/*" = ["B018"]
